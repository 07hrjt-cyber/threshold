name: Garmin Sync

# Runs the Garmin sync daily and commits the fresh data back to the repo.
# GitHub Pages then serves the updated threshold-garmin-import.json
# automatically — THRESHOLD picks it up next time you open the page.

on:
  schedule:
    # 6am UTC daily. GitHub Actions cron is always UTC — adjust the hour
    # to land at whatever local time you want (e.g. for 6am in a UTC-5
    # timezone, use '0 11 * * *').
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated JSON back

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Garmin sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        # --days 3 gives overlap so a failed/skipped run doesn't leave a
        # gap — safe to re-run since THRESHOLD merges by date/activity ID.
        run: python garmin_sync.py --days 3

      - name: Commit updated data
        run: |
          git config user.name "garmin-sync-bot"
          git config user.email "actions@github.com"
          git add threshold-garmin-import.json
          git diff --staged --quiet || git commit -m "Daily Garmin sync $(date -u +%Y-%m-%d)"
          git push
